<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TicketHub · 工单反馈联动原型</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="data.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="SystemA.jsx"></script>
  <script type="text/babel" src="OpsCenter.jsx"></script>
  <script type="text/babel" src="SystemB.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // Highlight pulse for hand-offs between panes (unused but kept for extensibility)

    function Toast({ messages }) {
      return (
        <div className="toast-stack">
          {messages.map(m => (
            <div key={m.id} className="toast">
              <span className="icon-wrap"><Icon name="check" size={13} /></span>
              {m.text}
            </div>
          ))}
        </div>
      );
    }

    function App() {
      const [tickets, setTickets] = useState(() => {
        try {
          const saved = localStorage.getItem('tickethub-v3');
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return window.INITIAL_TICKETS;
      });
      const [activeTab, setActiveTab] = useState(() => localStorage.getItem('tickethub-tab') || 'user');
      const [widgetView, setWidgetView] = useState('menu');
      const [selectedOpsId, setSelectedOpsId] = useState(null);
      const [selectedBId, setSelectedBId] = useState(null);
      const [toasts, setToasts] = useState([]);
      const [flashTab, setFlashTab] = useState(null);

      useEffect(() => {
        try { localStorage.setItem('tickethub-v3', JSON.stringify(tickets)); } catch (e) {}
      }, [tickets]);
      useEffect(() => {
        localStorage.setItem('tickethub-tab', activeTab);
      }, [activeTab]);

      const toast = useCallback((text) => {
        const id = Date.now() + Math.random();
        setToasts(ts => [...ts, { id, text }]);
        setTimeout(() => setToasts(ts => ts.filter(t => t.id !== id)), 3200);
      }, []);

      const flash = useCallback((tabId) => {
        setFlashTab(tabId);
        setTimeout(() => setFlashTab(null), 1800);
      }, []);

      const handleSubmitTicket = useCallback((ticket) => {
        setTickets(ts => [ticket, ...ts]);
        flash('ops');
        setSelectedOpsId(ticket.id);
        setTimeout(() => {
          setActiveTab('ops');
          toast(`新工单 ${ticket.id} 已推送至中台 · 自动高亮`);
        }, 900);
      }, [flash, toast]);

      const handleUpdateTicket = useCallback((updated) => {
        setTickets(ts => ts.map(t => t.id === updated.id ? updated : t));
        // If newly associated to B, flash B
        if (updated.associatedBId) {
          const original = tickets.find(t => t.id === updated.id);
          if (original && !original.associatedBId) {
            flash('b');
            setSelectedBId(updated.id);
          }
        }
      }, [tickets, flash]);

      const resetDemo = () => {
        if (confirm('重置演示数据？所有本地修改将丢失。')) {
          setTickets(window.INITIAL_TICKETS);
          setSelectedOpsId(null);
          setSelectedBId(null);
          toast('演示数据已重置');
        }
      };

      const tabs = [
        { id: 'user', label: '系统 A · 一线用户', sub: '提单入口', role: 'user' },
        { id: 'ops', label: '运营中台 · TicketHub', sub: '核心工作台', role: 'ops' },
        { id: 'b', label: '系统 B · 研发中心', sub: '下游承接', role: 'dev' }
      ];

      const counts = {
        user: tickets.filter(t => t.creator.includes('u_88213')).length,
        ops: tickets.filter(t => t.status === 'pending').length,
        b: tickets.filter(t => t.associatedBId).length
      };

      return (
        <div className="app">
          <header className="topbar">
            <div className="brand">
              <div className="brand-mark">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M2 9a3 3 0 010 6v2a2 2 0 002 2h16a2 2 0 002-2v-2a3 3 0 010-6V7a2 2 0 00-2-2H4a2 2 0 00-2 2z" />
                  <path d="M13 5v2M13 11v2M13 17v2" />
                </svg>
              </div>
              <div>
                <div className="brand-name">TicketHub</div>
                <div className="brand-sub">工单反馈 · 三端联动</div>
              </div>
              <div className="env-pill">演示环境 · v1.1</div>
            </div>
            <div className="topbar-tabs">
              {tabs.map(t => (
                <button
                  key={t.id}
                  className={`tab ${activeTab === t.id ? 'active' : ''} ${flashTab === t.id ? 'flash' : ''}`}
                  onClick={() => setActiveTab(t.id)}
                >
                  <div className="tab-label">
                    {t.label}
                    {counts[t.id] > 0 && <span className="num">{counts[t.id]}</span>}
                  </div>
                  <div className="tab-sub">{t.sub}</div>
                </button>
              ))}
            </div>
            <div className="topbar-right">
              <button className="reset-btn" onClick={resetDemo} title="重置演示数据">
                <Icon name="refresh" size={13} />
                <span>重置</span>
              </button>
            </div>
          </header>

          <main className="stage">
            {activeTab === 'user' && (
              <SystemAView
                tickets={tickets}
                onSubmit={handleSubmitTicket}
                widgetView={widgetView}
                setWidgetView={setWidgetView}
                toast={toast}
              />
            )}
            {activeTab === 'ops' && (
              <OpsCenter
                tickets={tickets}
                selectedId={selectedOpsId}
                onSelect={setSelectedOpsId}
                onUpdate={handleUpdateTicket}
                toast={toast}
              />
            )}
            {activeTab === 'b' && (
              <SystemBView
                tickets={tickets}
                selectedId={selectedBId}
                onSelect={setSelectedBId}
              />
            )}
          </main>

          <Toast messages={toasts} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
